_format_version: "3.0"
_transform: true

services:
  - name: football-backend-service
    # Uses internal Docker DNS name
    url: http://football-backend:8080
    routes:
      - name: football-routes
        paths:
          - /
        strip_path: false

plugins:
  # Enforce Rate Limiting
  - name: rate-limiting
    config:
      minute: 15
      policy: local

  # Enable In-Memory Proxy Caching for GET requests
  - name: proxy-cache
    config:
      strategy: memory
      cache_ttl: 300
      content_type:
        - "application/json; charset=utf-8"
        - "application/json"
      request_method:
        - GET
      memory:
        dictionary_name: kong_db_cache