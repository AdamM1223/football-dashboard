version: '3.8'

networks:
  football-net:
    driver: bridge

services:
  football-backend:
    build: backend
    container_name: football-backend
    ports:
      - "8080:8080"
    environment:
      - API_SPORTS_KEY=${API_SPORTS_KEY}
    networks:
      - football-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - football-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - football-net
    depends_on:
      - prometheus

